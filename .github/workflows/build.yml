name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build EasyLatex.sln -c Release
      - name: Verify parser, patch safety, API protocol and process cancellation
        run: dotnet run --project tests/EasyLatex.Tests -c Release --no-build -- artifacts/unit-verification --unit-only
      - name: Verify SyncTeX index against reference queries
        run: dotnet run --project tests/EasyLatex.Tests -c Release --no-build -- artifacts/sync-performance --perf-only
      - name: Fetch verified compiler
        # Templates pin the resource subset; bootstrap still verifies online and offline builds.
        uses: actions/cache@v6.1.0
        with:
          path: .tools/compiler-cache
          key: windows-tectonic-0.17.0-${{ hashFiles('src/EasyLatex/Templates.cs') }}
      - name: Prepare verified compiler and template resources
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -WarmCache
      - name: Publish self-contained portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - name: Verify published app with empty cache and blocked network
        shell: pwsh
        run: ./scripts/verify-portable.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: EasyLatex-win-x64
          path: |
            artifacts/EasyLatex-win-x64.zip
            artifacts/SHA256SUMS.txt
          retention-days: 14
