name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build EasyLatex.sln -c Release
      - name: Verify parser, patch safety, API protocol and process cancellation
        run: dotnet run --project tests/EasyLatex.Tests -c Release --no-build -- artifacts/unit-verification --unit-only
      - name: Fetch verified compiler
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Publish self-contained portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Publish
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLatex-win-x64
          path: artifacts/EasyLatex-win-x64.zip
          retention-days: 14
